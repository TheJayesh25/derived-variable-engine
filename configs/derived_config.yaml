enable_validation: true
# enable_validation: false

derived_variables:

  # -----------------------------
  # Satisfaction Index (1–5 scale)
  # -----------------------------
  - name: SATIS
    label: Satisfaction Index
    source_columns:
      - q100_1
      - q100_2
      - q100_3
      - q100_4
      - q100_5
      - q100_6
      - q100_7
      - q100_8
    aggregation: mean
    special_codes: [-98, -99]
    fallback_strategy: propagate_special
    multi_special_fallback: -98
    scale_min: 1
    scale_max: 5
    min_valid_ratio: 0.5

  # -----------------------------
  # Loyalty Score (1–7 scale)
  # -----------------------------
  - name: LOYALTY
    label: Loyalty Score
    source_columns:
      - q200_1
      - q200_2
      - q200_3
      - q200_4
      - q200_5
    aggregation: mean
    special_codes: [-98,-99]
    fallback_strategy: nan_if_no_valid
    scale_min: 1
    scale_max: 7
    min_valid_ratio: 0.6

  # -----------------------------
  # NPS Composite (0–10 scale)
  # -----------------------------
  - name: NPS_COMPOSITE
    label: NPS Composite
    source_columns:
      - q300_1
      - q300_2
      - q300_3
    aggregation: mean
    special_codes: [-98,-99]
    fallback_strategy: propagate_special
    multi_special_fallback: -99
    scale_min: 0
    scale_max: 10
    min_valid_ratio: 0.5

  # -----------------------------
  # Simple Sum Example
  # -----------------------------
  - name: SATIS_SUM
    label: Satisfaction Total Score
    source_columns:
      - q100_1
      - q100_2
      - q100_3
      - q100_4
    aggregation: sum
    special_codes: [-98, -99]
    fallback_strategy: nan_if_no_valid
    scale_min: 1
    scale_max: 5

  # -----------------------------
  # Weighted Mean Example
  # -----------------------------
  - name: WEIGHTED_SATIS
    label: Weighted Satisfaction Index
    source_columns:
      - q100_1
      - q100_2
      - q100_3
    aggregation: weighted_mean
    weights: [0.5, 0.3, 0.2]
    special_codes: [-98, -99]
    fallback_strategy: nan_if_no_valid
    scale_min: 1
    scale_max: 5
